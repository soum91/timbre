name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: Timbre
  BUILD: ${{ github.run_number }}
  TAG: build-${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Timbre.xcodeproj -scheme Timbre -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD \
            build | tee build.log | grep -E "error:|warning: .*(deprecated)?|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Timbre.app

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Timbre.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/Timbre.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/Timbre.app/Info.plist)
          IPA="$APP-$VERSION-build-$BUILD.ipa"
          zip -qr "$IPA" Payload
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Changelog
        run: |
          .github/scripts/release-notes.sh "$APP" "$VERSION" "$BUILD" 'build-*' "$TAG" \
            "Unsigned IPA. Sideload with TrollStore, AltStore, Sideloadly or SideStore." > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-build-${{ env.BUILD }}-ipa
          path: ${{ env.IPA }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Timbre ${{ env.VERSION }} build ${{ env.BUILD }}
          body_path: release-notes.md
          files: ${{ env.IPA }}
          make_latest: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
