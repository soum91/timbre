name: Build IPA

on:
  push:
    branches: [amazon-web-audio-test]
    paths-ignore: ["addon/**", ".github/workflows/addon.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: Timbre
  BUILD: ${{ github.run_number }}
  TAG: amazon-web-audio-test-${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Timbre.xcodeproj -scheme Timbre -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD \
            build | tee build.log | grep -E "error:|warning: .*(deprecated)?|BUILD" || true
          grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error title=compile::/' || true
          test -x build/Build/Products/Release-iphoneos/Timbre.app/Timbre

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Timbre.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/Timbre.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/Timbre.app/Info.plist)
          # Sideloaders (FlareStore etc.) only compare the version string, so make it <version>.<build>.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" Payload/Timbre.app/Info.plist
          WX=Payload/Timbre.app/PlugIns/TimbreWidget.appex
          test -x "$WX/TimbreWidget"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$WX/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" "$WX/Info.plist"
          # Ad-hoc sign with the App Group entitlement so sideloaders keep it for the widget / Live Activity.
          codesign --force --sign - --timestamp=none --entitlements TimbreWidget/TimbreWidget.entitlements "$WX"
          codesign --force --sign - --timestamp=none --entitlements Timbre/Timbre.entitlements Payload/Timbre.app
          codesign -d --entitlements - "$WX" || true
          IPA="$APP-$VERSION-build-$BUILD.ipa"
          zip -qr "$IPA" Payload
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Changelog
        run: |
          .github/scripts/release-notes.sh "$APP" "$VERSION" "$BUILD" 'build-*' "$TAG" \
            "Unsigned IPA. Sideload with TrollStore, AltStore, Sideloadly or SideStore." > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-build-${{ env.BUILD }}-ipa
          path: ${{ env.IPA }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Timbre Amazon Web Audio Test ${{ env.VERSION }} build ${{ env.BUILD }}
          body_path: release-notes.md
          files: ${{ env.IPA }}
          prerelease: true
          make_latest: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
