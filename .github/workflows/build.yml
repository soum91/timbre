name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Timbre.xcodeproj -scheme Timbre -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*(deprecated)?|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Timbre.app

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Timbre.app Payload/
          zip -qr Timbre.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Timbre-ipa
          path: Timbre.ipa

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Timbre.ipa --title "Timbre (latest build)" \
            --notes "Unsigned IPA built from ${GITHUB_SHA::7}. Sideload with TrollStore, AltStore, Sideloadly or SideStore." --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
