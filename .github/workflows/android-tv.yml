name: Android TV APK (experimental)

on:
  push:
    branches: [android-tv-prototype]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK and Native DSP toolchain
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Gradle otherwise makes a new debug certificate on every ephemeral runner,
      # preventing Android from installing the next APK over the previous one.
      # This cache reuses the key across builds on android-tv-prototype.
      - name: Restore Android TV debug signing identity
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .timbre-signing/timbre-tv-debug.keystore
          key: timbre-tv-android-debug-signing-v1
      - name: Provision stable experimental signing certificate
        run: |
          mkdir -p .timbre-signing
          if [ ! -f .timbre-signing/timbre-tv-debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore .timbre-signing/timbre-tv-debug.keystore \
              -storepass android -keypass android -alias timbre-tv-debug \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname 'CN=Timbre TV Experimental, O=soum91'
          fi
      - name: Build Android TV debug APK
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleDebug
      - name: Report APK signing certificate fingerprint
        run: |
          test -f .timbre-signing/timbre-tv-debug.keystore
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-tv/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Timbre-TV-experimental-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
