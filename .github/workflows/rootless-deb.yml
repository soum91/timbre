
name: Build Rootless DEB and Publish Sileo Repo

on:
  push:
    branches: [timbre-rootless]
    paths:
      - "Tweak/**"
      - "NativeDSP/**"
      - "scripts/generate-repo.sh"
      - ".github/workflows/rootless-deb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg
          command -v ldid
          command -v dpkg-scanpackages

      - name: Install Theos and iOS SDK
        run: |
          git clone --depth 1 --recursive \
            https://github.com/theos/theos.git "$THEOS"

          git clone --depth 1 \
            https://github.com/theos/sdks.git /tmp/theos-sdks

          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"

      - name: Fix maintainer script permissions
        run: |
          chmod 755 Tweak/layout/DEBIAN/postinst
          chmod 755 Tweak/layout/DEBIAN/prerm

          ls -l Tweak/layout/DEBIAN/

      - name: Build tweak and controller app
        run: |
          set -o pipefail
          make -C Tweak clean package \
            FINALPACKAGE=1 \
            ARCHS=arm64 2>&1 | tee build.log

          ls -lh Tweak/packages/*.deb

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git checkout --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Build log for ${GITHUB_SHA}"
          git push -f origin ci-logs

      - name: Verify package contents
        run: |
          DEB=$(find Tweak/packages -name '*.deb' -print -quit)
          test -n "$DEB"

          dpkg-deb --contents "$DEB"
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tvf -

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: timbre-rootless-with-app
          path: Tweak/packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Generate APT repository
        run: |
          bash scripts/generate-repo.sh

      - name: Publish Sileo repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
