name: Build Rootless DEB and Publish Sileo Repo
on:
  push:
    branches: [timbre-rootless]
    paths:
      - "Tweak/**"
      - "NativeDSP/**"
      - "scripts/generate-repo.sh"
      - ".github/workflows/rootless-deb.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install ldid dpkg
          command -v ldid
          command -v dpkg-scanpackages
      - name: Install Theos and SDK
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"
      - name: Build tweak and controller app
        run: |
          make -C Tweak clean package FINALPACKAGE=1 ARCHS=arm64
          ls -lh Tweak/packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: timbre-rootless-with-app
          path: Tweak/packages/*.deb
          if-no-files-found: error
      - name: Generate APT repository
        run: bash scripts/generate-repo.sh
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
