plugins {
    id 'com.android.application'
}

def timbreSigningKey = file('../../.timbre-signing/timbre-tv-debug.keystore')

android {
    namespace 'com.soum91.timbretv'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.soum91.timbretv'
        minSdk 28
        targetSdk 32
        versionCode 8
        versionName '0.8.0-experimental'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        timbreDebug {
            storeFile timbreSigningKey
            storePassword 'android'
            keyAlias 'timbre-tv-debug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // Local developer builds still use Gradle's normal debug signing.
            if (timbreSigningKey.exists()) signingConfig signingConfigs.timbreDebug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
