plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soum91.timbretv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soum91.timbretv'
        minSdk 28
        targetSdk 32
        versionCode 2
        versionName '0.2.0-experimental'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
